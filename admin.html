<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e17">
<title>MC Console — Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e17; --panel:#141927; --panel2:#1b2236; --line:#2a3350; --ink:#e8ecff; --dim:#8b94c0;
    --gold:#ffcc4d; --ok:#4cc971; --bad:#ff5d5d; --blue:#3b6cff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:"Barlow Semi Condensed",sans-serif; }
  #app { max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:12px 14px; background:rgba(11,14,23,.96); border-bottom:1px solid var(--line); }
  .phase-chip { font-family:"Anton",sans-serif; letter-spacing:.1em; text-transform:uppercase; font-size:13px;
    color:var(--gold); border:1px solid var(--gold); border-radius:999px; padding:4px 12px; }
  header .spacer { flex:1; }
  button { font-family:inherit; font-weight:800; font-size:15px; color:var(--ink); background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; padding:10px 14px; cursor:pointer; }
  button:active { filter:brightness(1.25); }
  button.gold { background:linear-gradient(180deg,#ffe9a8,var(--gold) 60%,#d9930d); color:#151000; border:none; }
  button.ok { background:#153822; border-color:#2c6a41; color:#8cf0ab; }
  button.bad { background:#3a1620; border-color:#7a2c3c; color:#ff9aa5; }
  button.ghost { background:transparent; }
  button.wide { width:100%; padding:14px; font-size:17px; }
  button:disabled { opacity:.4; }
  main { flex:1; padding:14px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .card h3 { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  .answer-box { background:#241d05; border:1px solid #6b5716; border-radius:10px; padding:12px; }
  .answer-box .lbl { font-size:11px; letter-spacing:.2em; color:#b89b3d; text-transform:uppercase; }
  .answer-box .val { font-size:20px; font-weight:800; color:var(--gold); }
  .notes { font-size:14px; color:var(--dim); border-left:3px solid var(--line); padding-left:10px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row > .grow { flex:1; }
  input[type=text], input[type=number] { font-family:inherit; font-size:16px; color:var(--ink); background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; }
  .mini-grid { display:grid; grid-template-columns:repeat(var(--cols,5),1fr); gap:6px; }
  .mini-grid .mcat { font-size:10px; font-weight:800; text-transform:uppercase; color:var(--dim);
    text-align:center; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:30px; line-height:1.15; }
  .mini-grid button.tile { font-family:"Anton",sans-serif; font-size:15px; color:var(--gold); padding:10px 0; position:relative; }
  .mini-grid button.tile.used { opacity:.25; text-decoration:line-through; }
  .mini-grid button.tile .dd { position:absolute; top:2px; right:4px; font-size:9px; color:#ff9aa5; }
  .queue { display:flex; flex-direction:column; gap:8px; }
  .q-item { display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; font-size:16px; font-weight:600; }
  .q-item.first { border-color:var(--gold); box-shadow:0 0 12px rgba(255,204,77,.25); }
  .q-item .pos { font-family:"Anton",sans-serif; color:var(--gold); }
  .q-item.lockedq { opacity:.4; text-decoration:line-through; }
  .team-line { display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; }
  .team-line .nm { flex:1; font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-line .sc { font-family:"Anton",sans-serif; color:var(--gold); }
  .team-line .sc.neg { color:var(--bad); }
  .team-line button { padding:6px 10px; font-size:13px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:30; background:#3a1620;
    color:#ff9aa5; border:1px solid #7a2c3c; padding:10px 18px; border-radius:999px; font-weight:800; }
  .toast.good { background:#153822; color:#8cf0ab; border-color:#2c6a41; }
  details.zone { border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  details.zone summary { padding:12px 14px; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--dim); cursor:pointer; list-style:none; }
  details.zone .inner { padding:0 14px 14px; display:flex; flex-direction:column; gap:10px; }
  .hintline { font-size:13px; color:var(--dim); }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="phase-chip" id="chip">…</span>
    <span class="spacer"></span>
    <button id="undo" class="ghost">↩︎ Undo</button>
  </header>
  <main id="main"></main>
</div>
<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient("https://vvzyaqvzurruskavuffe.supabase.co", "sb_publishable_Dtu3UBIiYcl7FasVR-aawg_-PpggO-s");
const API_BASE = "https://vvzyaqvzurruskavuffe.supabase.co/functions/v1/game";   // the game edge function URL

const api = async (body) => {
  const r = await fetch(API_BASE, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return j;
};

function watch(onPoke) {
  let t;
  const poke = () => { clearTimeout(t); t = setTimeout(onPoke, 80); };
  sb.channel("game")
    .on("postgres_changes", { event: "*", schema: "public", table: "game_state" }, poke)
    .on("postgres_changes", { event: "*", schema: "public", table: "teams" }, poke)
    .subscribe((status) => { if (status === "SUBSCRIBED") poke(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poke(); });
  setInterval(poke, 15000); // party-proof fallback poll
  poke();
}

const ytId = (u) => {
  try {
    const url = new URL(u);
    if (url.hostname.includes("youtu.be")) return url.pathname.slice(1);
    if (url.searchParams.get("v")) return url.searchParams.get("v");
    const m = url.pathname.match(/\/(embed|shorts|live)\/([\w-]{6,})/);
    return m ? m[2] : null;
  } catch { return null; }
};

// Sibling view URL that works both statically hosted (board.html → buzzer.html)
// and served by the edge function (?view=board → ?view=buzzer).
const pageUrl = (name) => location.pathname.endsWith(".html")
  ? location.origin + location.pathname.replace(/[^/]*$/, name + ".html")
  : location.origin + location.pathname + "?view=" + name;

const fmt = (n) => (n < 0 ? "−$" + Math.abs(n).toLocaleString("en-US") : "$" + Number(n).toLocaleString("en-US"));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));


const KEY = new URLSearchParams(location.search).get("key");
const chip = document.getElementById("chip");
const main = document.getElementById("main");
let S = null;
let pendingClue = null;   // clue selected in the grid, awaiting confirm
let busy = false;

async function run(op, extra = {}, { refresh = true } = {}) {
  if (busy) return null;
  busy = true;
  try {
    const r = await api({ op, key: KEY, ...extra });
    if (refresh) await load();
    return r;
  } catch (e) { toast(e.message); return null; }
  finally { busy = false; }
}

async function load() {
  S = await api({ op: "state", key: KEY });
  render();
}

function toast(msg, good = false) {
  document.querySelectorAll(".toast").forEach((n) => n.remove());
  const d = document.createElement("div");
  d.className = "toast" + (good ? " good" : "");
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

document.getElementById("undo").addEventListener("click", async () => {
  const r = await run("undo");
  if (r) toast("Undid: " + r.undid, true);
});

const teamById = (id) => (S?.teams ?? []).find((t) => t.id === id);
const clueById = (id) => (S?.clues ?? []).find((c) => c.id === id);

const PHASE_LABEL = {
  setup: "Setup", board: "Pick a clue", dd_wager: "DD Wager", clue_open: "Clue open",
  armed: "Buzzers live", reveal: "Answer shown", final_wager: "Final: wagers",
  final_clue: "Final: answers", final_reveal: "Final: reveal", done: "Game over",
};

function render() {
  if (!S) return;
  chip.textContent = PHASE_LABEL[S.phase] ?? S.phase;
  const parts = [];
  if (S.phase === "setup") parts.push(setupCard());
  if (S.phase === "board") parts.push(gridCard());
  if (S.phase === "dd_wager") parts.push(ddWagerCard());
  if (["clue_open", "armed", "reveal"].includes(S.phase)) parts.push(clueCard());
  if (S.phase === "final_wager") parts.push(finalWagerCard());
  if (["final_clue", "final_reveal"].includes(S.phase)) parts.push(finalDriveCard());
  if (S.phase === "done") parts.push('<div class="card"><h3>Game over</h3><div class="hintline">Crown delivered. Reset below for a rematch.</div></div>');
  parts.push(scoresZone(), dangerZone());
  // Realtime pokes re-render mid-typing — keep input values and focus alive.
  const keep = {};
  main.querySelectorAll("input[id]").forEach((i) => { keep[i.id] = i.value; });
  const focusId = document.activeElement?.id;
  const openZones = [...main.querySelectorAll("details[open]")].map((d, i) => d.querySelector("summary")?.textContent ?? String(i));
  main.innerHTML = parts.join("");
  for (const [id, v] of Object.entries(keep)) {
    const el = main.querySelector("#" + CSS.escape(id));
    if (el && !el.value) el.value = v;
  }
  main.querySelectorAll("details").forEach((d) => {
    if (openZones.includes(d.querySelector("summary")?.textContent)) d.open = true;
  });
  if (focusId) main.querySelector("#" + CSS.escape(focusId))?.focus();
  wire();
}

/* ---------------- cards ---------------- */

function setupCard() {
  const buzzUrl = pageUrl("buzzer");
  const boardUrl = pageUrl("board");
  return `<div class="card"><h3>Teams</h3>
    ${(S.teams ?? []).map((t) => `
      <div class="team-line" data-team="${t.id}">
        <span>${esc(t.emoji)}</span><span class="nm">${esc(t.name)}</span>
        <span class="hintline">${t.claimed ? "📱 claimed" : "unclaimed"}</span>
        <button data-act="team-del">✕</button>
      </div>`).join("")}
    <div class="row"><input type="text" id="new-name" class="grow" placeholder="Team name">
      <input type="text" id="new-emoji" placeholder="🦁" style="width:64px;text-align:center"></div>
    <button id="team-add" class="wide">+ Add team</button>
    <button id="start" class="gold wide" ${(S.teams ?? []).length >= 2 ? "" : "disabled"}>Start the game ▶</button>
    <div class="hintline">Board: ${esc(boardUrl)}<br>Buzzers: ${esc(buzzUrl)}</div>
  </div>`;
}

function gridCard() {
  const cats = S.grid ?? [];
  const allDone = cats.every((c) => c.clues.every((x) => x.answered));
  let confirm = "";
  if (pendingClue) {
    const c = clueById(pendingClue);
    if (c) {
      confirm = `<div class="card" style="border-color:var(--gold)">
        <h3>${esc(c.category)} — $${c.points} ${c.is_daily_double ? "· 💰 DAILY DOUBLE" : ""}</h3>
        <div>${esc(c.prompt)}</div>
        <div class="answer-box"><div class="lbl">Answer (only you see this)</div><div class="val">${esc(c.expected_answer)}</div></div>
        ${c.mc_notes ? `<div class="notes">${esc(c.mc_notes)}</div>` : ""}
        <div class="row">
          <button class="gold grow" data-act="open-clue" data-id="${c.id}">Put it on the board</button>
          <button data-act="cancel-clue">Cancel</button>
        </div>
      </div>`;
    }
  }
  return `${confirm}<div class="card"><h3>The board</h3>
    <div class="mini-grid" style="--cols:${cats.length || 1}">
      ${cats.map((c) => `<div class="mcat">${esc(c.category)}</div>`).join("")}
      ${[0, 1, 2, 3, 4].map((row) =>
        cats.map((c) => {
          const cl = c.clues[row];
          if (!cl) return "<span></span>";
          const full = clueById(cl.id);
          return `<button class="tile ${cl.answered ? "used" : ""}" data-act="pick-clue" data-id="${cl.id}" ${cl.answered ? "disabled" : ""}>
            ${cl.points}${full?.is_daily_double ? '<span class="dd">DD</span>' : ""}</button>`;
        }).join("")
      ).join("")}
    </div>
    <button class="${allDone ? "gold" : ""} wide" data-act="final-start">🎬 Final Jeopardy ${allDone ? "" : "(board not finished)"}</button>
  </div>`;
}

function ddWagerCard() {
  const control = S.data?.control;
  return `<div class="card" style="border-color:var(--gold)"><h3>💰 Daily Double — who found it &amp; wager</h3>
    <div class="hintline">Max: the team's score or $1,000, whichever is higher. Min $100.</div>
    ${(S.teams ?? []).map((t) => `
      <label class="team-line"><input type="radio" name="ddteam" value="${t.id}" ${t.id === control ? "checked" : ""}>
        <span>${esc(t.emoji)}</span><span class="nm">${esc(t.name)}</span><span class="sc">${fmt(t.score)}</span></label>`).join("")}
    <div class="row"><input type="number" id="dd-amount" class="grow" placeholder="Wager" inputmode="numeric">
      <button data-act="dd-set" class="gold">Set wager</button></div>
  </div>`;
}

function clueCard() {
  const ac = S.active_clue;
  const full = S.active_full ?? clueById(ac?.id) ?? {};
  const isDD = !!ac?.is_daily_double;
  const order = S.data?.buzz_order ?? [];
  const locked = S.data?.locked ?? [];
  const first = teamById(order[0]);
  const judgeTarget = isDD ? teamById(ac.team_id) : first;
  const hasHiddenMedia = ["youtube_audio"].includes(ac?.clue_type) && !ac?.media_revealed;
  return `<div class="card">
    <h3>${esc(ac.category)} — ${isDD ? "DD wager " + fmt(ac.wager ?? 0) : "$" + ac.points}</h3>
    <div>${esc(full.prompt ?? ac.prompt ?? "")}</div>
    <div class="answer-box"><div class="lbl">Answer (only you see this)</div><div class="val">${esc(full.expected_answer ?? "…")}</div></div>
    ${full.mc_notes ? `<div class="notes">${esc(full.mc_notes)}</div>` : ""}
    ${hasHiddenMedia ? '<button class="wide" data-act="media-reveal">🎬 Reveal the video</button>' : ""}
    ${S.phase === "clue_open" && !isDD ? '<button class="gold wide" data-act="arm">🔔 ARM BUZZERS</button>' : ""}
    ${S.phase === "armed" ? '<button class="ghost wide" data-act="disarm">Pause buzzers</button>' : ""}
    ${(S.phase === "armed" || isDD) && S.phase !== "reveal" ? `
      <div class="queue">
        ${order.map((id, i) => { const t = teamById(id); return t ? `<div class="q-item ${i === 0 ? "first" : ""}"><span class="pos">${i + 1}</span> ${esc(t.emoji)} ${esc(t.name)}</div>` : ""; }).join("")}
        ${locked.map((id) => { const t = teamById(id); return t ? `<div class="q-item lockedq">✘ ${esc(t.emoji)} ${esc(t.name)}</div>` : ""; }).join("")}
        ${!order.length && !isDD ? '<div class="hintline">Waiting for buzzes…</div>' : ""}
      </div>
      ${judgeTarget ? `<div class="row">
        <button class="ok grow" data-act="judge-right">✔ ${esc(judgeTarget.name)} is RIGHT</button>
        <button class="bad grow" data-act="judge-wrong">✘ WRONG</button>
      </div>` : ""}` : ""}
    ${S.phase !== "reveal" ? '<button class="ghost wide" data-act="reveal-answer">👁 Reveal answer to the room</button>' : ""}
    <button class="wide" data-act="clue-close">Back to the board →</button>
  </div>`;
}

function finalWagerCard() {
  const inIds = S.data?.final?.wagers_in ?? [];
  return `<div class="card"><h3>Final Jeopardy — secret wagers</h3>
    ${(S.teams ?? []).map((t) => `
      <div class="team-line"><span>${esc(t.emoji)}</span><span class="nm">${esc(t.name)}</span>
        <span class="hintline">${inIds.includes(t.id) ? "🔒 locked in" : "waiting…"}</span></div>`).join("")}
    <div class="hintline">Teams wager on their phones. Missing phones? A team with no wager counts as $0.</div>
    <button class="gold wide" data-act="final-clue">Reveal the clue ▶</button>
  </div>`;
}

function finalDriveCard() {
  const fin = S.data?.final ?? {};
  const full = (S.clues ?? []).find((c) => c.is_final) ?? {};
  const idx = fin.reveal_idx ?? 0;
  const nextId = (fin.order ?? [])[idx];
  const next = teamById(nextId);
  const wager = (S.wagers ?? []).find((w) => w.team_id === nextId && w.round === "final");
  return `<div class="card"><h3>Final Jeopardy — drive the reveal</h3>
    <div>${esc(full.prompt ?? "")}</div>
    <div class="answer-box"><div class="lbl">Answer (only you see this)</div><div class="val">${esc(full.expected_answer ?? "…")}</div></div>
    ${full.mc_notes ? `<div class="notes">${esc(full.mc_notes)}</div>` : ""}
    ${next ? `
      <div class="hintline">Next up (lowest score first): <b>${esc(next.emoji)} ${esc(next.name)}</b> — wagered ${fmt(wager?.amount ?? 0)}. Ask for their answer out loud, then:</div>
      <div class="row">
        <button class="ok grow" data-act="final-right">✔ RIGHT</button>
        <button class="bad grow" data-act="final-wrong">✘ WRONG</button>
      </div>`
    : '<button class="gold wide" data-act="game-over">🏆 Crown the champions</button>'}
  </div>`;
}

function scoresZone() {
  return `<details class="zone"><summary>Scores &amp; fixes</summary><div class="inner">
    ${(S.teams ?? []).map((t) => `
      <div class="team-line" data-team="${t.id}">
        <span>${esc(t.emoji)}</span><span class="nm">${esc(t.name)}</span>
        <span class="sc ${t.score < 0 ? "neg" : ""}">${fmt(t.score)}</span>
        <button data-act="adj" data-d="-100">−100</button>
        <button data-act="adj" data-d="100">+100</button>
      </div>`).join("")}
    <div class="hintline">Bigger fix? Tap −/+ repeatedly or use Undo.</div>
  </div></details>`;
}

function dangerZone() {
  return `<details class="zone"><summary>Danger zone</summary><div class="inner">
    <button data-act="reset-scores">Reset scores &amp; board (keep teams)</button>
    <button class="bad" data-act="reset-full">Full reset (wipe teams too)</button>
  </div></details>`;
}

/* ---------------- wiring ---------------- */
function wire() {
  main.querySelectorAll("[data-act]").forEach((el) => {
    const act = el.dataset.act;
    el.addEventListener("click", async () => {
      if (act === "team-del") {
        if (confirm("Remove this team?")) await run("team_delete", { team_id: Number(el.closest("[data-team]").dataset.team) });
      } else if (act === "pick-clue") { pendingClue = Number(el.dataset.id); render(); }
      else if (act === "cancel-clue") { pendingClue = null; render(); }
      else if (act === "open-clue") { pendingClue = null; await run("clue_open", { clue_id: Number(el.dataset.id) }); }
      else if (act === "arm") await run("arm");
      else if (act === "disarm") await run("disarm");
      else if (act === "media-reveal") await run("media_reveal");
      else if (act === "judge-right") await run("judge", { correct: true });
      else if (act === "judge-wrong") await run("judge", { correct: false });
      else if (act === "reveal-answer") await run("reveal_answer");
      else if (act === "clue-close") await run("clue_close");
      else if (act === "dd-set") {
        const team = main.querySelector("input[name=ddteam]:checked");
        const amt = Number(main.querySelector("#dd-amount").value);
        if (!team) return toast("pick the team that found it");
        await run("dd_wager", { team_id: Number(team.value), amount: amt });
      } else if (act === "final-start") {
        if (confirm("Head to Final Jeopardy?")) await run("final_start");
      } else if (act === "final-clue") await run("final_clue");
      else if (act === "final-right") await run("final_reveal_next", { correct: true });
      else if (act === "final-wrong") await run("final_reveal_next", { correct: false });
      else if (act === "game-over") await run("game_over");
      else if (act === "adj") await run("score_adjust", { team_id: Number(el.closest("[data-team]").dataset.team), delta: Number(el.dataset.d) });
      else if (act === "reset-scores") { if (confirm("Reset scores and re-open every clue?")) await run("game_reset", { mode: "scores" }); }
      else if (act === "reset-full") { if (confirm("Wipe EVERYTHING including teams?")) await run("game_reset", { mode: "full" }); }
    });
  });
  const add = main.querySelector("#team-add");
  if (add) add.addEventListener("click", async () => {
    const name = main.querySelector("#new-name").value.trim();
    if (!name) return toast("give the team a name");
    await run("team_add", { name, emoji: main.querySelector("#new-emoji").value.trim() || "🎉" });
  });
  const start = main.querySelector("#start");
  if (start) start.addEventListener("click", () => run("game_start"));
}

if (!KEY) { main.innerHTML = '<div class="card">Missing ?key=… in the URL.</div>'; }
else watch(async () => { try { await load(); } catch (e) { console.error(e); } });
</script>
</body>
</html>
